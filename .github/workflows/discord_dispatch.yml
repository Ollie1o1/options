name: Discord Desk Dispatch (24/7 Cloud)

on:
  schedule:
    # Off-peak UTC fallback schedule (silenced automatically once external exact-time
    # cron sets repo variable EXTERNAL_CRON_ACTIVE=true via scripts/setup_cloud_cron.py).
    # 1) Weekday Morning Desk Brief (~8:27 AM EST / 9:27 AM EDT) — 1 calm daily brief
    - cron: "27 13 * * 1-5"
    # 2) Weekday Mid-Morning Broad Market Sweep (~11:03 AM EST / 12:03 PM EDT) — all 60 ETFs & leaders
    - cron: "3 16 * * 1-5"
    # 3) Weekday Afternoon Pre-Close Sweep (~2:28 PM EST / 3:28 PM EDT) — all 60 ETFs & leaders + exit check
    - cron: "28 19 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to send to Discord"
        type: choice
        default: "options"
        options:
          - options
          - morning
          - afternoon
          - both
          - check
      strategy:
        description: "Options strategy filter"
        type: choice
        default: "all"
        options:
          - all
          - bull_put
          - long_call
          - long_put
          - calendar
          - iron_condor
          - bear_call
      session:
        description: "Session framing label"
        type: choice
        default: "auto"
        options:
          - auto
          - morning
          - midday
          - afternoon
          - manual
      tickers:
        description: "Optional comma-separated tickers (leave blank to scan all 60 ETFs & leaders)"
        required: false
        default: ""
      only_if_good:
        description: "Only ping Discord if setups clear strict friction & edge criteria"
        type: boolean
        default: false

jobs:
  dispatch:
    name: Discord Dispatch
    if: ${{ github.event_name != 'schedule' || vars.EXTERNAL_CRON_ACTIVE != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
      - name: Restore cached desk data (OHLCV, FRED & dedupe state)
        uses: actions/cache@v4
        with:
          path: |
            data/equity_ohlcv.db
            data/fred_cache.json
            data/radar_cache.json
            data/notify_state.json
          key: desk-data-${{ github.run_id }}
          restore-keys: |
            desk-data-
      - name: Send Discord Dispatch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SEC_EDGAR_CONTACT: ${{ secrets.SEC_EDGAR_CONTACT }}
          OPTIONS_DESK_CLOUD_DISPATCH: "1"
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "ERROR: Add DISCORD_WEBHOOK_URL under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          MODE="${{ github.event.inputs.mode || 'options' }}"
          STRAT="${{ github.event.inputs.strategy || 'all' }}"
          SESSION="${{ github.event.inputs.session || 'auto' }}"
          TICKERS="${{ github.event.inputs.tickers || '' }}"
          ONLY_GOOD="${{ github.event.inputs.only_if_good || 'false' }}"

          if [ "${{ github.event.schedule }}" = "27 13 * * 1-5" ]; then
            MODE="morning"
          elif [ "${{ github.event.schedule }}" = "3 16 * * 1-5" ]; then
            MODE="options"
            SESSION="midday"
            ONLY_GOOD="true"
          elif [ "${{ github.event.schedule }}" = "28 19 * * 1-5" ]; then
            MODE="afternoon"
            SESSION="afternoon"
            ONLY_GOOD="true"
          fi

          refresh_desk_data() {
            if [ ! -f data/equity_ohlcv.db ]; then
              echo "Cold cloud cache — seeding data/equity_ohlcv.db via refresh --expand..."
              python -m src.cli.main refresh --expand || true
            else
              python -m src.cli.main refresh || true
            fi
          }

          if [ "$MODE" = "morning" ] || [ "$MODE" = "both" ]; then
            refresh_desk_data
            python -m src.cli.main notify --morning
          fi

          if [ "$MODE" = "options" ] || [ "$MODE" = "both" ] || [ "$MODE" = "afternoon" ]; then
            OPTS_ARGS=(notify --options --live --strategy "$STRAT" --session "$SESSION")
            if [ "$ONLY_GOOD" = "true" ]; then
              OPTS_ARGS+=(--only-if-good)
            fi
            if [ -n "$TICKERS" ]; then
              OPTS_ARGS+=(--tickers "$TICKERS")
            fi
            python -m src.cli.main "${OPTS_ARGS[@]}"
          fi

          if [ "$MODE" = "check" ] || [ "$MODE" = "afternoon" ]; then
            refresh_desk_data
            python -m src.cli.main notify --check
          fi
