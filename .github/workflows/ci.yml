name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies (pinned, reproducible)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-dev.txt
      - name: Run tests (live-network tests deselected)
        # Live-network tests are marked @pytest.mark.network and deselected here.
        # _phase*_stress.py files are ignored (not collected by default anyway).
        # No -x: one run surfaces every failure, and the annotate-failures plugin
        # publishes each as a check-run annotation (publicly readable).
        run: pytest tests/ -q --ignore=tests/_phase3_stress.py -m "not network"

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    # Blocking as of the ratchet in mypy.ini: 213 of 289 modules check clean,
    # and this job exists to keep them that way. It was continue-on-error while
    # it was permanently red, which meant it proved nothing for weeks.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -r requirements-dev.txt
      - name: mypy
        # Findings go to the job summary and to commit annotations as well as
        # the log, so a failure says WHAT broke without anyone opening a log.
        run: |
          set +e
          mypy src/ --config-file mypy.ini > mypy-out.txt 2>&1
          status=$?
          {
            echo '### mypy'
            echo ''
            echo '```'
            tail -n 400 mypy-out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat mypy-out.txt
          python scripts/mypy_annotate.py mypy-out.txt
          exit $status
