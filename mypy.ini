[mypy]
ignore_missing_imports = True
follow_imports = skip
check_untyped_defs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
exclude = (?x)(
    ^venv/
    | ^tests/
  )

# ---------------------------------------------------------------------------
# The ratchet.
#
# 213 of 289 modules type-check clean and the job BLOCKS on them, so anything
# new arrives checked. The 76 below carry 349 pre-existing errors and are
# exempted until someone cleans them; they are listed one per section so a
# module leaves the list by deleting its own two lines, and the list can only
# be added to deliberately.
#
# Exempt means UNCHECKED, not "known broken but harmless": among these errors
# are possible-None arithmetic and attribute access (union-attr, operator,
# index) that are latent crashes rather than style. Shrinking this list is
# real work, not bookkeeping.
#
# To see what a module owes:  mypy src/ --config-file mypy.ini | grep <module>
# The CI job publishes the current counts by code and by file as annotations —
# see scripts/mypy_annotate.py.
# ---------------------------------------------------------------------------

